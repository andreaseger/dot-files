# Global tool versions managed by mise (https://mise.jdx.dev)
# Install everything listed here with `mise install`.
# Add more with `mise use -g <tool>@<version>`.
[tools]
usage = "latest"
kubectl = "latest"
helm = "latest"
sops = "latest"
age = "latest"
gh = "latest"
go = "latest"
git-lfs = "latest"
neovim = "latest"
"npm:@openai/codex" = "latest"

[settings]
minimum_release_age_excludes = ["npm:@openai/codex"]
