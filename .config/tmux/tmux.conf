# set -g default-shell /usr/bin/fish

# Key bindings
# Smart pane switching with vim awareness
is_vim="ps -o comm= -t '#{pane_tty}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-Left if-shell "$is_vim" "send-keys C-Left" "select-pane -L"
bind -n C-Down if-shell "$is_vim" "send-keys C-Down" "select-pane -D"
bind -n C-Up if-shell "$is_vim" "send-keys C-Up" "select-pane -U"
bind -n C-Right if-shell "$is_vim" "send-keys C-Right" "select-pane -R"

# Pane resizing
bind -n M-h resize-pane -L
bind -n M-j resize-pane -D
bind -n M-k resize-pane -U
bind -n M-l resize-pane -R

# Sync panes
bind -n M-s set synchronize-panes

# Window management
bind-key -n F2 new-window -c "#{pane_current_path}"
bind-key -n F3 split-window -h -c "#{pane_current_path}"
bind-key -n F4 split-window -v -c "#{pane_current_path}"
bind-key -n F5 previous-window
bind-key -n F6 next-window

# Cycle through pane layouts (replaces prefix + Space)
bind-key -n F7 next-layout

# Rotate panes clockwise within the current layout
bind-key -n F8 rotate-window

# Copy mode
bind-key -n F9 copy-mode

# Close current pane
bind-key -n F10 kill-pane

# Detach
bind-key -n F12 detach

# Manually restore the last continuum/resurrect save (auto-restore is off below)
bind-key -n C-F12 run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh

# Override dotbar colors for better visibility on Ghostty
set -g @tmux-dotbar-bg '#0B0E14'           # Keep dark background
set -g @tmux-dotbar-fg '#6C7A89'           # Medium gray for inactive windows
set -g @tmux-dotbar-fg-current '#FFFFFF'   # Bright white for current window
set -g @tmux-dotbar-fg-session '#8B949E'   # Medium gray for session name
set -g @tmux-dotbar-fg-prefix '#95E6CB'    # Keep the prefix color

# Window format: include window number
set -g @tmux-dotbar-window-status-format ' #I|#W '

# load dotbar
# https://github.com/vaaleyard/tmux-dotbar
run ~/.config/tmux/plugins/dotbar.tmux

# --- Automatic session persistence (tmux-continuum) --------------------------
# Continuum auto-saves periodically. Auto-restore is OFF; restore manually with C-F12.
# It is driven by tmux-resurrect, which is its required backend engine
# (continuum calls resurrect's save/restore scripts) -- not a separate feature.
#   https://github.com/tmux-plugins/tmux-continuum
#   https://github.com/tmux-plugins/tmux-resurrect

# Capture running programs + scrollback in the saves, not just the layout
set -g @resurrect-capture-pane-contents 'on'

# Auto-save every 15 minutes; restore is manual (C-F12), not on server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# resurrect (backend) must load before continuum; keep these last
run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
