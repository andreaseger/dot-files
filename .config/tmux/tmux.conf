# Modern tmux configuration
# Source this with: tmux -f ~/.config/tmux/tmux.conf

# Basic settings
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 50000
set -sg escape-time 0
# no mouse support as it's kinda weird
set -g mouse off

# Vi keys
setw -g mode-keys vi

# Auto rename windows
setw -g automatic-rename
set -g set-titles on
set -g set-titles-string '#H:#I [#T]'

# Terminal type for modern setups
set -g default-terminal "tmux-256color"

# True color for all modern terminals
set -ga terminal-overrides ",xterm*:Tc"
set -ga terminal-overrides ",*:RGB"

# Ghostty-specific terminal overrides
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-overrides ",xterm-ghostty:RGB"

# Keep your existing colors override for fallback
set -ga terminal-overrides ",xterm*:colors=256"

# Optional on older distro packages; -q ignores unsupported options.
set -gq extended-keys on
set -gq extended-keys-format csi-u

# Activity monitoring (visual-activity off to prevent yellow flash on window switch)
set -g bell-action none
setw -g monitor-activity on
set -g visual-activity off

# Make focused pane much more obvious
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour45,bold
set -gq pane-border-lines double
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=colour16,bg=colour45,bold] ACTIVE #[default],#[fg=colour244] INACTIVE #[default]} #[fg=colour250]#P:#T"

